# Fly.io — backend de Faro (producción)
app = "faro-prod-api"
primary_region = "iad"  # cerca de Neon us-east-1

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  UPLOAD_DIR = "/data/uploads"   # volumen persistente
  COOKIE_SECURE = "true"         # HTTPS en prod

# Volumen persistente para imágenes subidas (favicon/productos).
[[mounts]]
  source = "faro_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # POS: siempre encendido (sin cold start)
  auto_start_machines = true
  min_machines_running = 1

  # Check de liveness: ¿el proceso vive y acepta tráfico? Apunta a /health, que
  # NO toca la DB. Con una sola máquina (min_machines_running=1, sin réplica a la
  # que enrutar) el check solo decide "vivo/muerto", no readiness de dependencias.
  # Usar /ready aquí forzaba un pool.Ping a Neon cada 15s, manteniéndolo despierto
  # 24/7 y quemando cuota de cómputo. Para readiness real (DB alcanzable) se usa
  # /ready manualmente en diagnóstico.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
